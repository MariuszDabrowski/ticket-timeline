<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4bcff"/>
      <stop offset="100%" stop-color="#5558e3"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Clock ring -->
  <circle cx="19" cy="16" r="9" fill="none" stroke="#fff" stroke-width="2.5"/>
  <!-- Minute hand -->
  <line x1="19" y1="16" x2="19" y2="9.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Hour hand -->
  <line x1="19" y1="16" x2="23.5" y2="18.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <!-- Left dashes -->
  <rect x="4" y="11" width="8" height="2.5" rx="1.25" fill="#fff"/>
  <rect x="3" y="15" width="10" height="2.5" rx="1.25" fill="#fff"/>
  <rect x="4" y="19" width="8" height="2.5" rx="1.25" fill="#fff"/>
</svg>
